name: Génération de séance

on:
  schedule:
    # 05:00 UTC = 06:00 l'hiver, 07:00 l'été à Lille.
    # pg_cron et GitHub Actions tournent en UTC : pas de gestion d'heure d'été.
    - cron: '0 5 * * *'
  workflow_dispatch:        # déclenchement manuel depuis l'onglet Actions

jobs:
  planifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cycle quotidien
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          MODEL_ID: gemini-2.5-flash-lite
        run: python -m src.main | tee resume.txt

      - name: Résumé
        if: always()
        run: cat resume.txt >> $GITHUB_STEP_SUMMARY || true
